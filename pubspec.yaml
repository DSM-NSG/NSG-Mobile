name: nsg_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.0
  material_symbols_icons: ^4.2782.0
  go_router: ^17.1.0
  shared_preferences: ^2.5.4
  image_picker: ^1.1.2
  intl: ^0.20.2
  timeago: ^3.7.1
  dio: ^5.4.0
  flutter_riverpod: ^2.6.1
  uuid: ^4.5.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1
  geolocator: ^13.0.1
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.0

flutter:
  uses-material-design: true

  fonts:
    - family: LINESeedKR
      fonts:
        - asset: assets/font/LINESeedKR-Bd.ttf
          weight: 700
        - asset: assets/font/LINESeedKR-Rg.ttf
          weight: 400

  assets:
    - assets/
    - assets/svg/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/svg/app_logo.png"
  min_sdk_android: 21